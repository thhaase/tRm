[package]
name = "trm"
version = "0.1.0"
edition = "2021"
description = "A lightweight RStudio-like IDE for the terminal"

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
vt100 = "0.16"
png = "0.18"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
